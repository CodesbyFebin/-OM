name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: cd tools/research-engine-v2 && pip install -e .
      - run: cd tools/research-engine-v2 && python -m unittest discover -s tests -t .
      - run: cd tools/research-engine-v2 && dh-research selftest
